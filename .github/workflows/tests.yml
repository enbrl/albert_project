name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The most recent packages, with the oldest and the most recent Python we support
  latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Check the code and the notebooks (pre-commit)
        if: matrix.python-version == '3.13'
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Install the packages
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest

  # The oldest packages that requirements.txt allows (constraints-min.txt), with Python 3.9
  oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: constraints-min.txt

      - name: Install the oldest packages
        run: pip install -c constraints-min.txt numpy pandas scikit-learn matplotlib requests beautifulsoup4 pytest

      - name: Show the versions
        run: pip list | grep -i -E "numpy|pandas|scikit-learn|matplotlib|requests|beautifulsoup4|joblib|pytest"

      - name: Run the tests
        run: python -m pytest
