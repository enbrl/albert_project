name: Web application

# Tests of app.py with Streamlit installed (the other tests do not need it).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app.py'
      - 'scripts/estimator.py'
      - 'scripts/models.py'
      - 'scripts/datacleaning.py'
      - 'tests/test_app.py'
      - 'tests/test_estimator.py'
      - 'requirements-app.txt'
      - '.github/workflows/app.yml'

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install the packages of the application
        run: pip install -r requirements-app.txt

      - name: Test the application
        run: python -m pytest tests/test_app.py tests/test_estimator.py -v
